# This is a basic workflow to help you get started with Actions

name: Refresh Data vaarwater info

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 13 * * *' # runs daily refresh at 12:00 UTC everyday

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      upload_all:
        description: 'Publish all generated files to the release, not only the changed ones'
        type: boolean
        default: false

permissions:
  contents: write

# Both refresh workflows publish to the same release and push to main
concurrency:
  group: waypoints-release
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  refreshBruggenetc:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12 #install the python needed
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: execute py script vwi_waypoints_generator # run the run.py to get the latest data
        run: |
              # any argument forces regeneration when the source data is unchanged
              if [ "$UPLOAD_ALL" = "true" ]; then python vwi_waypoints_generator.py force; else python vwi_waypoints_generator.py; fi
        env:
          key: ${{ secrets.key }} # if run.py requires passwords..etc, set it as secrets
          UPLOAD_ALL: ${{ inputs.upload_all }}

      - name: execute py script marrekritten_to_GPX.py # run the marrekritten_to_GPX.py to get the latest data
        run: |
              python marrekritten_to_GPX.py
        env:
          key: ${{ secrets.key }} # if run.py requires passwords..etc, set it as secrets

      - name: install additional python packages for chartcatalog.py 
        run: |
          pip install -r requirements-catalog.txt

      - name: execute py script # run the run.py to get the latest data
        env:
          UPLOAD_ALL: ${{ inputs.upload_all }}
        run: |
          if [ "$UPLOAD_ALL" = "true" ]; then python chartcatalog.py --all; else python chartcatalog.py; fi

      - name: execute daily charts script # run the run.py to get the latest data
        run: |
          python nl_enc_charts.py

      - name: Record download counts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_download_stats.py waypoints-latest

      - name: Publish changed files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release_assets.py waypoints-latest --list working/release-assets.txt

      - name: Commit changes
        uses: EndBug/add-and-commit@v11
        with:
          message: "Automatic github data refresh"
